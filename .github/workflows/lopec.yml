# 로펙 점수·젬 효율만 빠르게 갱신합니다. 앱의 "로펙 점수 갱신" 버튼에서 이 페이지로 연결됩니다.
# 저장소 Secrets의 SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY를 사용합니다.
name: 로펙 점수 갱신

on:
  workflow_dispatch:

jobs:
  lopec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/update_characters.py --lopec-only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
