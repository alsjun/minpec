# 매일 KST 새벽 5시에 로스트아크 API와 로펙 페이지로 캐릭터 정보를 갱신합니다.
# 저장소 Secrets에 LOSTARK_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY가 필요합니다.
# Actions 탭에서 수동 실행(workflow_dispatch)도 가능합니다.
name: 캐릭터 정보 갱신

on:
  schedule:
    - cron: '0 20 * * *' # UTC 20:00 = KST 05:00
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/update_characters.py
        env:
          LOSTARK_API_KEY: ${{ secrets.LOSTARK_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
